<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Billionaires Live — Wealth Tracker</title>
<style>
  :root{
    --bg:#080a0c; --panel:#0f1216; --panel2:#161a20; --line:#242a33;
    --txt:#e8e6df; --dim:#8a8f98; --accent:#ff9e2c; --up:#3ad07a; --down:#ff5c5c;
    --gold:#ffb020;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);
    font:13px/1.4 ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace}
  a{color:var(--accent)}
  .lnk{color:var(--accent);cursor:pointer;border-bottom:1px dotted var(--accent)}
  .lnk:hover{color:#ffc06a}
  header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:20}
  .brand{font-size:18px;font-weight:700;letter-spacing:.2px}
  .brand b{color:var(--gold)}
  .meta{color:var(--dim);font-size:12px}
  .grow{flex:1}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);position:sticky;top:53px;background:var(--bg);z-index:19}
  input,select,button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  button{cursor:pointer}
  button:hover{background:var(--panel2)}
  #search{min-width:230px}
  .chip{color:var(--dim);font-size:12px}
  .wrap{overflow:auto;height:calc(100vh - 104px)}
  table{border-collapse:collapse;width:100%;min-width:1100px}
  thead th{position:sticky;top:0;background:#0f1420;border-bottom:1px solid var(--line);
    text-align:left;padding:10px 12px;font-size:12px;color:var(--dim);white-space:nowrap;cursor:pointer;user-select:none}
  thead th:hover{color:var(--txt)}
  th .arw{opacity:.5;font-size:10px}
  tbody td{padding:8px 12px;border-bottom:1px solid #1a2030;white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#141b28}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .rank{color:var(--dim);width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .photo{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--panel2);display:block}
  .name{font-weight:600}
  .worth{font-weight:700;font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)}
  .pill{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--panel2);color:var(--dim);font-size:11px}
  .loading,.err{padding:40px;text-align:center;color:var(--dim)}
  .err{color:var(--down)}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .ov.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:820px;width:100%;max-height:88vh;overflow:auto}
  .mhead{display:flex;gap:14px;align-items:center;padding:18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
  .mhead img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--panel2)}
  .mbody{padding:18px;display:flex;flex-direction:column;gap:18px}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .kv div{background:var(--panel2);border-radius:10px;padding:9px 11px}
  .kv small{color:var(--dim);display:block;font-size:11px}
  .sec-title{font-size:13px;color:var(--dim);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}
  .htab{width:100%;border-collapse:collapse;min-width:0}
  .htab th,.htab td{padding:7px 9px;border-bottom:1px solid #202838;font-size:13px;text-align:right;white-space:nowrap}
  .htab th:first-child,.htab td:first-child,.htab th:nth-child(2),.htab td:nth-child(2){text-align:left}
  .close{margin-left:auto;font-size:22px;background:none;border:none;color:var(--dim);cursor:pointer}
  .close:hover{color:var(--txt)}
  svg .grid{stroke:#232c3d} svg .ln{fill:none;stroke:var(--gold);stroke-width:2}
  svg text{fill:var(--dim);font-size:10px}
  /* tabs */
  .tabs{display:flex;gap:4px;margin-left:6px}
  .tab{padding:6px 14px;border-radius:8px 8px 0 0;background:transparent;border:none;color:var(--dim);cursor:pointer;font-size:13px;font-weight:600}
  .tab.on{color:var(--txt);background:var(--panel);border-bottom:2px solid var(--accent)}
  /* stats bar */
  .stats{display:flex;gap:10px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line)}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px}
  .stat small{color:var(--dim);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .stat b{font-size:18px;font-variant-numeric:tabular-nums}
  .stat .sub{font-size:11px;color:var(--dim)}
  /* analytics */
  .charts{padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 12px;font-size:14px}
  .bar-row{display:grid;grid-template-columns:150px 1fr 92px;align-items:center;gap:8px;margin:6px 0;font-size:12px}
  .bar-row .lbl{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-track{background:var(--panel2);border-radius:6px;height:14px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#6aa8ff);border-radius:6px}
  .bar-val{text-align:right;font-variant-numeric:tabular-nums}
  .hide{display:none!important}
  /* live price ticker */
  .livepx{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .livepx #stkPrice{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 4px;border-radius:4px}
  .livepx .chg{font-size:15px;font-weight:600}
  .livebadge{font-size:11px;color:var(--up);font-weight:700;display:inline-flex;align-items:center;gap:5px}
  .livebadge .dot{width:8px;height:8px;border-radius:50%;background:var(--up);animation:pulse 1.4s infinite}
  .livebadge.closed{color:var(--dim)} .livebadge.closed .dot{background:var(--dim);animation:none}
  @keyframes pulse{0%{opacity:1;box-shadow:0 0 0 0 rgba(58,208,122,.5)}70%{opacity:.6;box-shadow:0 0 0 6px rgba(58,208,122,0)}100%{opacity:1}}
  @keyframes fu{0%{background:rgba(58,208,122,.45)}100%{background:transparent}}
  @keyframes fd{0%{background:rgba(255,92,92,.45)}100%{background:transparent}}
  .flash-up{animation:fu .7s} .flash-down{animation:fd .7s}
</style>
</head>
<body>
<header>
  <div class="brand"><b>●</b> Billionaires <span style="color:var(--dim);font-weight:400">Live Wealth Terminal</span></div>
  <div class="tabs">
    <button class="tab on" data-view="people">People</button>
    <button class="tab" data-view="companies">Companies</button>
    <button class="tab" data-view="analytics">Analytics</button>
  </div>
  <input id="cmd" placeholder="⌘ ticker → GO (e.g. AAPL, TSLA, NVDA)" style="min-width:230px" />
  <div class="grow"></div>
  <div class="meta" id="meta">loading…</div>
  <button id="refresh">↻ Refresh</button>
</header>

<div class="stats" id="stats"></div>

<div class="toolbar" id="toolbar">
  <input id="search" placeholder="Search name, company, country, city…" />
  <select id="fIndustry"><option value="">All industries</option></select>
  <select id="fCountry"><option value="">All countries</option></select>
  <select id="fSelf"><option value="">Self-made & inherited</option><option value="self">Self-made</option><option value="inh">Inherited</option></select>
  <span class="chip" id="count"></span>
  <div class="grow"></div>
  <button id="csv">⬇ Export CSV</button>
</div>

<div class="wrap" id="view-people">
  <div id="status" class="loading">Loading live data…</div>
  <table id="tbl" style="display:none">
    <thead><tr id="hrow"></tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>

<div class="wrap hide" id="view-companies">
  <div class="toolbar" style="top:0"><input id="csearch" placeholder="Search company or ticker…"/><span class="chip" id="ccount"></span></div>
  <table id="ctbl"><thead><tr id="chrow"></tr></thead><tbody id="cbody"></tbody></table>
</div>

<div class="charts hide" id="view-analytics"></div>

<div class="ov" id="ov">
  <div class="modal">
    <div class="mhead">
      <img id="mimg" alt="" />
      <div>
        <div style="font-size:18px;font-weight:700" id="mname"></div>
        <div class="meta" id="msub"></div>
      </div>
      <button class="close" id="mclose">×</button>
    </div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const fmtB = m => m==null ? "—" : "$" + (m/1000).toLocaleString(undefined,{maximumFractionDigits:1}) + "B";
const fmtNum = n => n==null ? "—" : Number(n).toLocaleString();

// Columns: key, label, numeric, render
const COLS = [
  {k:"rank",  t:"#",           num:true,  r:p=>`<span class="rank">${p.rank}</span>`},
  {k:"photo", t:"",            num:false, r:p=> p.image?`<img class="photo" loading="lazy" src="${p.image}" onerror="this.style.visibility='hidden'">`:""},
  {k:"name",  t:"Name",        num:false, r:p=>`<span class="name">${esc(p.name)}</span>`},
  {k:"worth", t:"Net Worth",   num:true,  r:p=>`<span class="worth">${fmtB(p.worth)}</span>`},
  {k:"changePct", t:"Change 24h", num:true, r:p=>changeCell(p)},
  {k:"industry", t:"Industry", num:false, r:p=>`<span class="chip">${esc((p.industries||[]).join(", ")||"—")}</span>`},
  {k:"source", t:"Source",     num:false, r:p=>esc(p.source||"—")},
  {k:"holdings", t:"Top Holdings", num:false, r:p=>topHold(p)},
  {k:"age",   t:"Age",         num:true,  r:p=>p.age??"—"},
  {k:"gender",t:"Gender",      num:false, r:p=>esc(p.gender||"—")},
  {k:"country",t:"Country",    num:false, r:p=>esc(p.country||"—")},
  {k:"city",  t:"City",        num:false, r:p=>esc(p.city||"—")},
  {k:"selfMade",t:"Self-Made", num:false, r:p=> p.selfMadeRank!=null?`${p.selfMadeRank}/10`:(p.selfMade===true?"Yes":p.selfMade===false?"No":"—")},
  {k:"philanthropy",t:"Philan.",num:true, r:p=>p.philanthropy??"—"},
];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function changeCell(p){
  if(p.changePct==null) return '<span class="chip">—</span>';
  const up=p.changePct>=0, cls=up?"up":"down", s=up?"+":"−";
  return `<span class="${cls}">${s}${fmtB(Math.abs(p.changeAbs)).slice(1)} · ${s}${Math.abs(p.changePct).toFixed(2)}%</span>`;
}
function topHold(p){
  const c=p.companies||[];
  if(!c.length) return '<span class="chip">—</span>';
  return c.slice(0,2).map(h=>`<span class="chip">${esc(h.ticker||h.company)} $${(h.value/1000).toFixed(1)}B</span>`).join(" ");
}
function sortVal(p,k){
  if(k==="industry") return (p.industries||[]).join(", ");
  if(k==="holdings") return (p.companies&&p.companies[0]?p.companies[0].value:-Infinity);
  if(k==="photo") return "";
  const v=p[k]; return v==null?(COLS.find(c=>c.k===k)?.num?-Infinity:""):v;
}

let ALL=[], VIEW=[], sortKey="rank", sortDir=1;

async function load(){
  $("#status").style.display="block"; $("#status").className="loading"; $("#status").textContent="Loading live data…";
  $("#tbl").style.display="none";
  try{
    let r;
    try{
      r = await fetch("/api/data",{cache:"no-store"});
    }catch(netErr){
      // TypeError "Failed to fetch" = the request never reached a server.
      const file = location.protocol === "file:";
      throw new Error(file
        ? "This page was opened as a local file, so the /api backend isn't running. Open the deployed https://…vercel.app URL (or run `vercel dev`) instead of double-clicking the HTML."
        : "Couldn't reach /api/data (network error). If you deployed to Vercel, make sure the whole folder — including the api/ directory — was pushed, then redeploy.");
    }
    if(!r.ok){
      let detail=""; try{ detail=(await r.json()).error||""; }catch(_){}
      throw new Error("Server returned HTTP "+r.status+(detail?" — "+detail:"")+". Forbes may be rate-limiting the server; try Refresh in a minute.");
    }
    const j = await r.json();
    if(j.error) throw new Error(j.error);
    ALL = j.people;
    $("#meta").textContent = `${j.count.toLocaleString()} billionaires · updated ${new Date(j.updatedAt).toLocaleTimeString()}`;
    renderStats(); buildFilters(); apply();
    buildCompanies(); if(curView==="companies") renderCompanies();
    if(curView==="analytics") renderAnalytics();
    $("#status").style.display="none"; $("#tbl").style.display="";
  }catch(e){
    $("#status").className="err";
    $("#status").innerHTML = "Couldn't load data:<br>"+esc(e.message);
  }
}

function buildFilters(){
  const inds=new Set(), ctys=new Set();
  ALL.forEach(p=>{ (p.industries||[]).forEach(i=>inds.add(i)); if(p.country) ctys.add(p.country); });
  fill("#fIndustry",[...inds].sort()); fill("#fCountry",[...ctys].sort());
}
function fill(sel,arr){
  const el=$(sel), keep=el.value;
  el.length=1; arr.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;el.appendChild(o);});
  el.value=keep;
}

function apply(){
  const q=$("#search").value.trim().toLowerCase();
  const fi=$("#fIndustry").value, fc=$("#fCountry").value, fs=$("#fSelf").value;
  VIEW = ALL.filter(p=>{
    if(fi && !(p.industries||[]).includes(fi)) return false;
    if(fc && p.country!==fc) return false;
    if(fs==="self" && p.selfMade!==true) return false;
    if(fs==="inh"  && p.selfMade!==false) return false;
    if(q){
      const hay=(p.name+" "+p.source+" "+p.country+" "+p.city+" "+(p.industries||[]).join(" ")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  VIEW.sort((a,b)=>{
    const va=sortVal(a,sortKey), vb=sortVal(b,sortKey);
    if(typeof va==="number"&&typeof vb==="number") return (va-vb)*sortDir;
    return String(va).localeCompare(String(vb))*sortDir;
  });
  $("#count").textContent = `${VIEW.length.toLocaleString()} shown`;
  render();
}

function header(){
  $("#hrow").innerHTML = COLS.map(c=>{
    const arw = c.k===sortKey ? `<span class="arw">${sortDir>0?"▲":"▼"}</span>` : "";
    return `<th class="${c.num?"num":""}" data-k="${c.k}">${c.t} ${arw}</th>`;
  }).join("");
  $("#hrow").querySelectorAll("th").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;
    if(k===sortKey) sortDir*=-1; else {sortKey=k; sortDir = (COLS.find(c=>c.k===k)?.num)?-1:1;}
    apply();
  });
}

function render(){
  header();
  const rows = VIEW.map(p=>
    `<tr data-uri="${esc(p.uri)}">`+COLS.map(c=>`<td class="${c.num?"num":""}">${c.r(p)}</td>`).join("")+`</tr>`
  ).join("");
  const b=$("#body"); b.innerHTML=rows;
  b.querySelectorAll("tr[data-uri]").forEach(tr=>tr.onclick=()=>openPerson(tr.dataset.uri));
}

async function openPerson(uri){
  const p = ALL.find(x=>x.uri===uri); if(!p) return;
  $("#mimg").style.display=""; $("#mimg").src = p.image||""; $("#mname").textContent=p.name;
  $("#msub").textContent = `#${p.rank} · ${fmtB(p.worth)} · ${(p.industries||[]).join(", ")||"—"}`;
  // Render immediately from data we already have (holdings ship with /api/data).
  $("#mbody").innerHTML = personHtml(p, null);
  $("#ov").classList.add("on");
  // Then enrich with wealth history + bio; failure here is non-fatal.
  try{
    const r=await fetch("/api/person?uri="+encodeURIComponent(uri));
    if(r.ok){ const d=await r.json(); if(!d.error) $("#mbody").innerHTML = personHtml(p,d); }
    else { markHistErr("Details API returned HTTP "+r.status); }
  }catch(e){ markHistErr("Wealth history unavailable (couldn't reach the details API)."); }
}
function markHistErr(msg){ const el=document.getElementById("histNote"); if(el) el.textContent=msg; }

/* ---------- LIVE STOCK PANEL (Yahoo via /api/quote) ---------- */
let stockRange="1y";
async function openStock(ticker, company){
  if(!ticker) return;
  window.__stk={ticker,company};
  $("#mimg").style.display="none";
  $("#mname").textContent = ticker;
  $("#msub").textContent = company||"";
  $("#mbody").innerHTML='<div class="loading">Loading live quote…</div>';
  $("#ov").classList.add("on");
  try{
    const r=await fetch("/api/quote?symbol="+encodeURIComponent(ticker)+"&range="+stockRange);
    const d= r.ok ? await r.json() : {error:"HTTP "+r.status};
    $("#mbody").innerHTML=stockHtml(ticker,company,d);
  }catch(e){ $("#mbody").innerHTML=stockHtml(ticker,company,{error:"couldn't reach quote API"}); }
  // Fundamentals load in the background and patch in when ready (non-fatal).
  fetch("/api/fundamentals?symbol="+encodeURIComponent(ticker)).then(r=>r.ok?r.json():null).then(f=>{
    const box=document.getElementById("fundBox");
    if(!box || !window.__stk || window.__stk.ticker!==ticker) return;
    box.innerHTML = (f && !f.error) ? fundHtml(f) : '<span class="chip">Fundamentals unavailable for this symbol.</span>';
  }).catch(()=>{});
  startStockPoll(ticker);   // live price updates while the panel is open
}

/* ---- live price polling (as close to real-time as free data allows) ---- */
function stopStockPoll(){ if(window.__stkPoll){ clearInterval(window.__stkPoll); window.__stkPoll=null; } }
async function pollTick(ticker){
  if(!$("#ov").classList.contains("on") || !window.__stk || window.__stk.ticker!==ticker){ stopStockPoll(); return; }
  // 1) Try Finnhub real-time (server keeps the key secret).
  try{
    const r=await fetch("/api/live?symbol="+encodeURIComponent(ticker),{cache:"no-store"});
    if(r.ok){ const d=await r.json();
      if(d.enabled && d.realtime && d.price!=null){ updateLivePrice({price:d.price,change:d.change,changePct:d.changePct,currency:'USD'}); setLiveMode(true); return; }
    }
  }catch(e){}
  // 2) Fall back to Yahoo (delayed) polling.
  try{
    const r=await fetch("/api/quote?symbol="+encodeURIComponent(ticker)+"&range=1d",{cache:"no-store"});
    const d=r.ok?await r.json():null; if(d&&!d.error){ updateLivePrice(d); setLiveMode(false); }
  }catch(e){}
}
function startStockPoll(ticker){
  stopStockPoll();
  pollTick(ticker);
  window.__stkPoll=setInterval(()=>pollTick(ticker), 6000);
}
function setLiveMode(rt){
  const b=$("#liveBadge"); if(!b) return;
  b.classList.toggle("closed",!rt);
  b.innerHTML=`<span class="dot"></span>${rt?"REAL-TIME":"DELAYED ~15m"}`;
}
function updateLivePrice(d){
  const el=$("#stkPrice"), ce=$("#stkChg"), te=$("#stkTime"); if(!el) return;
  const cur=d.currency&&d.currency!=="USD"?" "+d.currency:"";
  const prev=parseFloat(String(el.textContent).replace(/[^0-9.]/g,""));
  el.textContent="$"+(d.price!=null?d.price.toLocaleString(undefined,{maximumFractionDigits:2}):"—")+cur;
  if(!isNaN(prev) && d.price!=null && d.price!==prev){
    el.classList.remove("flash-up","flash-down"); void el.offsetWidth;
    el.classList.add(d.price>prev?"flash-up":"flash-down");
  }
  if(ce && d.changePct!=null){ const up=d.changePct>=0,s=up?"+":"−"; ce.className="chg "+(up?"up":"down");
    ce.textContent=`${s}${Math.abs(d.change).toFixed(2)} · ${s}${Math.abs(d.changePct).toFixed(2)}%`; }
  if(te) te.textContent="updated "+new Date().toLocaleTimeString();
}
function setRange(rg){ stockRange=rg; if(window.__stk) openStock(window.__stk.ticker, window.__stk.company); }

function fundHtml(f){
  const pct=v=>v==null?"—":(v*100).toFixed(1)+"%";
  const cap=v=>v==null?"—":(v>=1e12?"$"+(v/1e12).toFixed(2)+"T":v>=1e9?"$"+(v/1e9).toFixed(2)+"B":v>=1e6?"$"+(v/1e6).toFixed(1)+"M":"$"+v);
  const num=v=>v==null?"—":Number(v).toFixed(2);
  const kv=[
    ["Market cap",cap(f.marketCap)],["P/E (ttm)",num(f.pe)],["Fwd P/E",num(f.forwardPe)],["EPS",num(f.eps)],
    ["Revenue",cap(f.revenue)],["Rev growth",pct(f.revenueGrowth)],["Profit margin",pct(f.profitMargin)],["Gross margin",pct(f.grossMargin)],
    ["ROE",pct(f.roe)],["Beta",num(f.beta)],["P/B",num(f.priceToBook)],["Div yield",pct(f.dividendYield)],
    ["Analyst target",f.targetMean!=null?"$"+num(f.targetMean):"—"],["Rating",f.recommendation||"—"],
    ["Sector",f.sector||"—"],["Industry",f.industry||"—"],["Employees",f.employees?Number(f.employees).toLocaleString():"—"],["HQ",f.country||"—"],
  ].map(([k,v])=>`<div><small>${k}</small>${esc(String(v))}</div>`).join("");
  const summary=f.summary?`<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--dim)">Business summary</summary><p style="color:var(--dim);line-height:1.5">${esc(f.summary)}</p></details>`:"";
  return `<div class="kv">${kv}</div>${summary}`;
}

function stockHtml(ticker, company, d){
  const comp = COMPS.find(c=>(c.ticker||"")===ticker);
  let holders='';
  if(comp){
    const rows=comp.holders.slice(0,15).map(h=>`<tr><td>${esc(h.name)}</td><td class="num">#${h.rank}</td><td class="num worth">${fmtB(h.value)}</td></tr>`).join("");
    holders=`<div><p class="sec-title">Billionaire holders (${comp.holders.length}) · combined ${fmtB(comp.total)}</p>
      <table class="htab"><thead><tr><th>Name</th><th>Rank</th><th>Stake</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  if(d.error){
    return `<div class="err" style="padding:16px">Live quote unavailable for ${esc(ticker)} (${esc(d.error)}).<br>
      <small>Private companies (e.g. SpaceX) and some foreign tickers aren't on Yahoo.</small></div>${holders}`;
  }
  const cur=d.currency&&d.currency!=="USD"?" "+d.currency:"";
  const up=(d.changePct||0)>=0, cls=up?"up":"down", s=up?"+":"−";
  const px = d.price!=null?"$"+d.price.toLocaleString(undefined,{maximumFractionDigits:2})+cur:"—";
  const chg = d.changePct!=null?`<span class="${cls}">${s}${Math.abs(d.change).toFixed(2)} · ${s}${Math.abs(d.changePct).toFixed(2)}%</span>`:"";
  // RSI(14) from the price series (needs enough points).
  let rsiCell="—";
  if(d.series && d.series.length>15){
    const rv=rsi(d.series.map(s=>s.c),14); const last=rv.filter(v=>v!=null).pop();
    if(last!=null){ const rc=last>70?"down":last<30?"up":""; rsiCell=`<span class="${rc}">${last.toFixed(0)}${last>70?" (overbought)":last<30?" (oversold)":""}</span>`; }
  }
  const kv=[
    ["Day range", d.dayLow!=null?`${d.dayLow.toFixed(2)} – ${d.dayHigh.toFixed(2)}`:"—"],
    ["52-wk range", d.fiftyTwoLow!=null?`${d.fiftyTwoLow.toFixed(2)} – ${d.fiftyTwoHigh.toFixed(2)}`:"—"],
    ["RSI (14)", rsiCell],["Exchange", d.exchange||"—"],["Symbol", d.symbol||ticker],
  ].map(([k,v])=>`<div><small>${k}</small>${v}</div>`).join("");
  const ranges=["1d","5d","1mo","6mo","1y","5y"].map(rg=>`<button class="tab ${rg===stockRange?'on':''}" onclick="setRange('${rg}')">${rg.toUpperCase()}</button>`).join("");
  const chart = d.series&&d.series.length>1 ? candleChart(d.series) : '<div class="chip">No price history</div>';
  const live=`<div class="livepx">
      <span id="stkPrice">${px}</span>
      <span class="chg" id="stkChg">${chg}</span>
      <span class="livebadge" id="liveBadge"><span class="dot"></span>LIVE</span>
      <span class="chip" id="stkTime"></span>
    </div>`;
  return `${live}
    <div><div class="kv">${kv}</div></div>
    <div><div style="display:flex;gap:4px;margin-bottom:6px">${ranges}</div>${chart}</div>
    <div><p class="sec-title">Fundamentals</p><div id="fundBox"><span class="chip">Loading fundamentals…</span></div></div>
    ${holders}`;
}

function fmtVol(v){ if(v>=1e9)return (v/1e9).toFixed(1)+"B"; if(v>=1e6)return (v/1e6).toFixed(1)+"M"; if(v>=1e3)return (v/1e3).toFixed(0)+"K"; return v; }
/* ---- technical indicators (client-side, no external data) ---- */
function sma(arr,n){const out=Array(arr.length).fill(null);let s=0;for(let i=0;i<arr.length;i++){s+=arr[i];if(i>=n)s-=arr[i-n];if(i>=n-1)out[i]=s/n;}return out;}
function rsi(arr,n){const out=Array(arr.length).fill(null);let g=0,l=0;for(let i=1;i<arr.length;i++){const ch=arr[i]-arr[i-1];const up=Math.max(ch,0),dn=Math.max(-ch,0);if(i<=n){g+=up;l+=dn;if(i===n){g/=n;l/=n;out[i]=100-100/(1+(l===0?100:g/l));}}else{g=(g*(n-1)+up)/n;l=(l*(n-1)+dn)/n;out[i]=100-100/(1+(l===0?100:g/l));}}return out;}
function candleChart(series){
  const intraday = stockRange==="1d"||stockRange==="5d";
  const W=900,H=360, padL=52,padR=10,padT=12, priceH=248, volTop=priceH+26, volH=54;
  const n=series.length;
  const maxP=Math.max(...series.map(d=>d.h)), minP=Math.min(...series.map(d=>d.l)), rng=(maxP-minP)||1;
  const maxV=Math.max(...series.map(d=>d.v||0))||1;
  const cw=(W-padL-padR)/n;
  const bodyW=Math.max(1, Math.min(cw*0.7, 9));
  const x=i=> padL + i*cw + cw/2;
  const y=v=> padT + (maxP-v)/rng*priceH;
  const vy=v=> volTop+volH - (v/maxV)*volH;

  const grid=[0,.25,.5,.75,1].map(f=>{const yy=padT+f*priceH;const val=maxP-rng*f;
    return `<line class="grid" x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}"/><text x="4" y="${(yy+3).toFixed(1)}">${val.toFixed(val<10?2:0)}</text>`;}).join("");
  const vgrid=`<line class="grid" x1="${padL}" y1="${volTop}" x2="${W-padR}" y2="${volTop}"/><line class="grid" x1="${padL}" y1="${volTop+volH}" x2="${W-padR}" y2="${volTop+volH}"/><text x="4" y="${volTop+10}">${fmtVol(maxV)}</text><text x="4" y="${volTop+volH}">Vol</text>`;

  const candles=series.map((d,i)=>{
    const cx=x(i), rise=d.c>=d.o, col=rise?"var(--up)":"var(--down)";
    const yH=y(d.h), yL=y(d.l), top=Math.min(y(d.o),y(d.c)), bh=Math.max(0.8,Math.abs(y(d.c)-y(d.o)));
    return `<line x1="${cx.toFixed(1)}" y1="${yH.toFixed(1)}" x2="${cx.toFixed(1)}" y2="${yL.toFixed(1)}" stroke="${col}" stroke-width="0.8"/>`+
           `<rect x="${(cx-bodyW/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bodyW.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}"/>`;
  }).join("");
  const vols=series.map((d,i)=>{const cx=x(i),rise=d.c>=d.o;const yv=vy(d.v||0);
    return `<rect x="${(cx-bodyW/2).toFixed(1)}" y="${yv.toFixed(1)}" width="${bodyW.toFixed(1)}" height="${Math.max(0,(volTop+volH-yv)).toFixed(1)}" fill="${rise?'#2c7a52':'#7a2c2c'}"/>`;}).join("");

  // Moving-average overlays (skip on short intraday windows where they're noise).
  let overlays="",legend="";
  if(!intraday && n>=30){
    const closes=series.map(d=>d.c);
    const maLine=(period,col)=>{const s=sma(closes,period);let dsp="",started=false;for(let i=0;i<s.length;i++){if(s[i]==null)continue;dsp+=(started?"L":"M")+x(i).toFixed(1)+" "+y(s[i]).toFixed(1)+" ";started=true;}return started?`<path d="${dsp.trim()}" fill="none" stroke="${col}" stroke-width="1.2" opacity="0.9"/>`:"";};
    overlays = maLine(50,"#4c8dff")+ (n>=200?maLine(200,"#e9b949"):"");
    legend = `<text x="${padL}" y="${padT-2}" fill="#4c8dff">— SMA50</text>`+(n>=200?`<text x="${padL+70}" y="${padT-2}" fill="#e9b949">— SMA200</text>`:"");
  }

  const step=Math.ceil(n/8);
  const opt = intraday?{hour:'2-digit',minute:'2-digit',...(stockRange==="5d"?{month:'short',day:'numeric'}:{})}:{month:'short',year:'2-digit'};
  const xlab=series.map((d,i)=> (i%step===0)?`<text x="${(x(i)-16).toFixed(1)}" y="${H-4}">${new Date(d.t*1000).toLocaleString(undefined,opt)}</text>`:"").join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">${legend}${grid}${vgrid}${overlays}${candles}${vols}${xlab}</svg>`;
}

function personHtml(p,d){
  const born = d&&d.birthCountry ? d.birthCountry : "";
  const lives = d ? [d.residenceState,d.residenceCountry].filter(Boolean).join(", ") : "";
  const kv = [
    ["Net worth",fmtB(p.worth)],["24h change", p.changePct==null?"—":(p.changePct>=0?"+":"−")+Math.abs(p.changePct).toFixed(2)+"%"],
    ["Rank","#"+p.rank],["Philanthropy",p.philanthropy!=null?p.philanthropy+"/5":"—"],
    ["Title",(d&&(d.title||d.organization))?[d.title,d.organization].filter(Boolean).join(" @ "):"—"],
    ["Source",p.source||"—"],["Industry",(p.industries||[]).join(", ")||"—"],
    ["Self-made",(d&&d.selfMadeType)?d.selfMadeType:(p.selfMadeRank!=null?p.selfMadeRank+"/10":(p.selfMade?"Yes":"No"))],
    ["Age",p.age??"—"],["Gender",p.gender||"—"],
    ["Born in",born||"—"],["Lives in",lives||p.city||"—"],
    ["Education",(d&&d.education)||"—"],["Marital",(d&&d.marital)||"—"],["Children",(d&&d.children)??"—"],["List years",(d&&d.listAppearances)||"—"],
  ].map(([k,v])=>`<div><small>${k}</small>${esc(v)}</div>`).join("");

  const quote = d&&d.quote ? `<div style="border-left:3px solid var(--gold);padding:6px 12px;color:var(--dim);font-style:italic">“${esc(d.quote)}”</div>` : "";

  const chart = !d ? '<div class="chip" id="histNote">Loading wealth history…</div>'
    : (d.wealth && d.wealth.length>1 ? wealthChart(d.wealth) : '<div class="chip">No wealth history</div>');

  let holdings='<div class="chip">No public-company holdings reported</div>';
  if(p.companies && p.companies.length){
    const rows=p.companies.map(c=>`<tr>
      <td>${c.ticker?`<span class="lnk" data-stock="${esc(c.ticker)}" data-co="${esc(c.company)}">${esc(c.ticker)}</span>`:"—"}</td><td>${esc(c.company)}</td>
      <td>${fmtNum(c.shares)}</td>
      <td>${c.price?"$"+c.price.toLocaleString(undefined,{maximumFractionDigits:2}):"—"}</td>
      <td>$${(c.value/1000).toLocaleString(undefined,{maximumFractionDigits:2})}B</td>
      <td>${p.worth?(c.value/p.worth*100).toFixed(1)+"%":"—"}</td></tr>`).join("");
    holdings=`<table class="htab"><thead><tr><th>Ticker</th><th>Company</th><th>Shares</th><th>Price</th><th>Stake</th><th>% NW</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  return `
    <div><div class="kv">${kv}</div></div>
    ${quote}
    <div><p class="sec-title">Wealth history ($B)</p>${chart}</div>
    <div><p class="sec-title">Public-company holdings</p>${holdings}</div>`;
}

function wealthChart(w){
  const W=760,H=220,pad=34;
  const xs=w.map(d=>d.year), ys=w.map(d=>d.worth/1000);
  const minY=0, maxY=Math.max(...ys)*1.1||1;
  const x=i=> pad + i*(W-pad*2)/(w.length-1);
  const y=v=> H-pad - (v-minY)/(maxY-minY)*(H-pad*2);
  const path = ys.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const grid=[0,.5,1].map(f=>{const yy=pad+f*(H-pad*2);const val=(maxY-(maxY-minY)*f);return `<line class="grid" x1="${pad}" y1="${yy}" x2="${W-pad}" y2="${yy}"/><text x="4" y="${yy+3}">$${val.toFixed(0)}B</text>`;}).join("");
  const xlab=w.map((d,i)=> (i%Math.ceil(w.length/8||1)===0)?`<text x="${x(i)-8}" y="${H-10}">${d.year}</text>`:"").join("");
  const dots=ys.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="var(--gold)"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">${grid}<path class="ln" d="${path}"/>${dots}${xlab}</svg>`;
}

function exportCsv(){
  const head=["Rank","Name","NetWorth($B)","Change24h(%)","Industry","Source","Age","Gender","Country","City","SelfMadeRank","Philanthropy"];
  const lines=[head.join(",")].concat(VIEW.map(p=>[
    p.rank, q(p.name), (p.worth/1000).toFixed(2), p.changePct==null?"":p.changePct.toFixed(2),
    q((p.industries||[]).join("; ")), q(p.source), p.age??"", p.gender||"", q(p.country), q(p.city),
    p.selfMadeRank??"", p.philanthropy??""
  ].join(",")));
  const blob=new Blob([lines.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="billionaires.csv";a.click();
}
function q(s){s=String(s==null?"":s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}

/* ---------- STATS BAR ---------- */
function renderStats(){
  const n=ALL.length;
  const total=ALL.reduce((s,p)=>s+(p.worth||0),0);           // $M
  const dayChange=ALL.reduce((s,p)=>s+(p.changeAbs||0),0);   // $M
  const ages=ALL.filter(p=>p.age).map(p=>p.age);
  const avgAge=ages.length?Math.round(ages.reduce((a,b)=>a+b,0)/ages.length):"—";
  const countries=new Set(ALL.map(p=>p.country).filter(Boolean)).size;
  const women=ALL.filter(p=>p.gender==="Female").length;
  const movers=ALL.filter(p=>p.changePct!=null);
  const gain=movers.reduce((a,b)=>(b.changeAbs>(a?a.changeAbs:-1e18)?b:a),null);
  const lose=movers.reduce((a,b)=>(b.changeAbs<(a?a.changeAbs:1e18)?b:a),null);
  const dc=(dayChange>=0?"up":"down"), sign=dayChange>=0?"+":"−";
  const stat=(lbl,val,sub,cls)=>`<div class="stat"><small>${lbl}</small><b class="${cls||''}">${val}</b>${sub?`<div class="sub">${sub}</div>`:""}</div>`;
  $("#stats").innerHTML =
    stat("Total wealth","$"+(total/1e6).toFixed(2)+"T", n.toLocaleString()+" people")+
    stat("24h change",(sign+"$"+Math.abs(dayChange/1e6).toFixed(2)+"T"),"combined",dc)+
    stat("Countries",countries,"represented")+
    stat("Avg age",avgAge,women+" women")+
    (gain?stat("Top gainer","▲ "+esc(gain.name.split(" ")[0]),"+"+gain.changePct.toFixed(1)+"% · "+fmtB(gain.worth),"up"):"")+
    (lose&&lose.changePct<0?stat("Top loser","▼ "+esc(lose.name.split(" ")[0]),lose.changePct.toFixed(1)+"% · "+fmtB(lose.worth),"down"):"");
}

/* ---------- VIEW TABS ---------- */
let curView="people";
function setView(v){
  curView=v;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.view===v));
  $("#view-people").classList.toggle("hide",v!=="people");
  $("#toolbar").classList.toggle("hide",v!=="people");
  $("#view-companies").classList.toggle("hide",v!=="companies");
  $("#view-analytics").classList.toggle("hide",v!=="analytics");
  if(v==="companies") renderCompanies();
  if(v==="analytics") renderAnalytics();
}

/* ---------- COMPANIES AGGREGATE (who owns what, combined) ---------- */
let COMPS=[];
function buildCompanies(){
  const map={};
  ALL.forEach(p=>(p.companies||[]).forEach(c=>{
    const key=(c.ticker||c.company||"?")+"|"+(c.exchange||"");
    if(!map[key]) map[key]={ticker:c.ticker,company:c.company,exchange:c.exchange,total:0,holders:[]};
    map[key].total+=c.value||0;
    map[key].holders.push({name:p.name,uri:p.uri,value:c.value,rank:p.rank});
  }));
  COMPS=Object.values(map).map(c=>{c.holders.sort((a,b)=>b.value-a.value);return c;})
    .sort((a,b)=>b.total-a.total);
}
const CCOLS=[
  {t:"#",num:true}, {t:"Ticker",num:false}, {t:"Company",num:false}, {t:"Exchange",num:false},
  {t:"Total Held",num:true}, {t:"Holders",num:true}, {t:"Top Holder",num:false},
];
function renderCompanies(){
  const q=($("#csearch").value||"").trim().toLowerCase();
  let list=COMPS;
  if(q) list=list.filter(c=>((c.ticker||"")+" "+(c.company||"")).toLowerCase().includes(q));
  $("#ccount").textContent=list.length.toLocaleString()+" companies";
  $("#chrow").innerHTML=CCOLS.map(c=>`<th class="${c.num?"num":""}">${c.t}</th>`).join("");
  $("#cbody").innerHTML=list.map((c,i)=>{
    const top=c.holders[0];
    return `<tr data-stock="${esc(c.ticker||"")}" data-co="${esc(c.company||"")}">
      <td class="num rank">${i+1}</td>
      <td><span class="lnk">${esc(c.ticker||"—")}</span></td>
      <td>${esc(c.company||"—")}</td>
      <td><span class="chip">${esc(c.exchange||"—")}</span></td>
      <td class="num worth">${fmtB(c.total)}</td>
      <td class="num">${c.holders.length}</td>
      <td>${esc(top?top.name:"—")} <span class="chip">${top?fmtB(top.value):""}</span></td>
    </tr>`;
  }).join("");
}

/* ---------- ANALYTICS ---------- */
function renderAnalytics(){
  const byInd=agg(p=>((p.industries||[])[0]||"Other"));
  const byCty=agg(p=>p.country||"Unknown");
  const gsplit=[["Male",ALL.filter(p=>p.gender==="Male").length],["Female",ALL.filter(p=>p.gender==="Female").length]];
  const smsplit=[["Self-made",ALL.filter(p=>p.selfMade===true).length],["Inherited/other",ALL.filter(p=>p.selfMade!==true).length]];
  const top10=[...ALL].sort((a,b)=>b.worth-a.worth).slice(0,10).map(p=>[p.name,p.worth]);
  $("#view-analytics").innerHTML =
    card("Top 10 by net worth ($B)", bars(top10.map(([n,v])=>[n,v/1000]),"$","B"))+
    card("Wealth by industry ($T)", bars(byInd.slice(0,12).map(([n,v])=>[n,v/1e6]),"$","T"))+
    card("Wealth by country ($T)", bars(byCty.slice(0,12).map(([n,v])=>[n,v/1e6]),"$","T"))+
    card("Billionaires by industry (count)", bars(cntAgg(p=>((p.industries||[])[0]||"Other")).slice(0,12),"",""))+
    card("Gender split", bars(gsplit,"",""))+
    card("Self-made vs inherited", bars(smsplit,"",""));
}
function agg(keyFn){const m={};ALL.forEach(p=>{const k=keyFn(p);m[k]=(m[k]||0)+(p.worth||0);});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function cntAgg(keyFn){const m={};ALL.forEach(p=>{const k=keyFn(p);m[k]=(m[k]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function card(title,body){return `<div class="card"><h3>${title}</h3>${body}</div>`;}
function bars(rows,pre,suf){
  const max=Math.max(...rows.map(r=>r[1]),1);
  return rows.map(([lbl,val])=>{
    const w=(val/max*100).toFixed(1);
    const disp=pre+(val>=100?Math.round(val).toLocaleString():val.toFixed(val<10?2:0))+suf;
    return `<div class="bar-row"><span class="lbl" title="${esc(lbl)}">${esc(lbl)}</span><div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div><span class="bar-val">${disp}</span></div>`;
  }).join("");
}

$("#search").oninput=apply; $("#fIndustry").onchange=apply; $("#fCountry").onchange=apply; $("#fSelf").onchange=apply;
$("#refresh").onclick=load; $("#csv").onclick=exportCsv;
$("#cmd").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const v=e.target.value.trim().toUpperCase(); if(v){ openStock(v, ""); } } });
$("#csearch").oninput=renderCompanies;
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setView(t.dataset.view));

function closeModal(){ $("#ov").classList.remove("on"); stopStockPoll(); window.__stk=null; }
$("#mclose").onclick=closeModal;
$("#ov").onclick=e=>{if(e.target===$("#ov"))closeModal();};
document.onkeydown=e=>{if(e.key==="Escape")closeModal();};

load();
setInterval(load, 180000); // auto-refresh every 3 min
